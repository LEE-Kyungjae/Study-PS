name: Compile

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile src/ (packaged solutions)
        run: |
          mkdir -p "$RUNNER_TEMP/src-out"
          find src -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -nowarn -d "$RUNNER_TEMP/src-out"
      # BaekjoonHub stores "public class Main" under the problem title
      # (e.g. 고양이.java), so each file is copied to <PublicClass>.java first.
      - name: Compile BaekjoonHub solutions (one file at a time)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            out=$(mktemp -d)
            cls=$(grep -oE 'public[[:space:]]+(final[[:space:]]+)?class[[:space:]]+[A-Za-z0-9_]+' "$f" | head -1 | awk '{print $NF}')
            cp "$f" "$out/${cls:-Main}.java"
            if ! javac -encoding UTF-8 -nowarn -d "$out/classes" "$out/${cls:-Main}.java"; then
              echo "::error file=$f::compilation failed"
              fail=1
            fi
            rm -rf "$out"
          done < <(find '백준' '프로그래머스' -name '*.java' -print0)
          exit $fail
